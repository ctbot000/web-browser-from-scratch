<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mote — render gallery</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         margin: 0; background: #eceff3; color: #1b1f23 }
  header { background: #16324f; color: #fff; padding: 28px 32px }
  header h1 { margin: 0; font-size: 1.5rem }
  header p { margin: 8px 0 0; color: #9fb4cc }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 60px }
  figure { margin: 0 0 32px; background: #fff; border: 1px solid #d8dee4;
           border-radius: 6px; overflow: hidden }
  figcaption { padding: 12px 16px; border-bottom: 1px solid #e6eaee;
               font-size: 0.9rem; color: #57606a; background: #f8f9fb }
  figcaption b { color: #1b1f23 }
  img { display: block; width: 100% }
  code { background: #eceff3; padding: 1px 5px; border-radius: 3px;
         font-size: 0.86em }
</style>
</head>
<body>
<header>
  <h1>Mote render gallery</h1>
  <p>Every image below is SVG written by Mote's own painter, from Mote's own
     layout. Regenerate with <code>python3 -m mote --svg FILE URL</code>.</p>
</header>
<main>
  <figure>
    <figcaption><b>examples/kitchen-sink.html</b> — floats, inline-block,
      tables, lists, positioning</figcaption>
    <img src="render-kitchen-sink.svg" alt="Kitchen sink page rendered by Mote">
  </figure>
  <figure>
    <figcaption><b>info.cern.ch</b> — the first web page, over HTTPS</figcaption>
    <img src="render-cern.svg" alt="The first web page rendered by Mote">
  </figure>
  <figure>
    <figcaption><b>example.com</b> — viewport units and auto margins</figcaption>
    <img src="render-example.svg" alt="example.com rendered by Mote">
  </figure>
  <figure>
    <figcaption><b>about:mote</b> — a page the browser serves itself</figcaption>
    <img src="render-about.svg" alt="about:mote rendered by Mote">
  </figure>
  <p style="text-align:center;color:#57606a;font-size:0.9rem">
    Source: <a href="https://github.com/ctbot000/web-browser-from-scratch"
    >github.com/ctbot000/web-browser-from-scratch</a></p>
</main>
</body>
</html>
